- insert:
    - id: mcp-sam-gov
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: sam-gov
        transport: stdio
        command: uvx
        args: ['--from', 'sam-gov-mcp==1.0.12', 'sam-gov-mcp']
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '3'
          SAM_API_KEY: !!js "process.env.SAM_API_KEY ?? ''"
    - id: mcp-usaspending
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: usaspending
        transport: stdio
        command: uvx
        args: ['--from', 'usaspending-gov-mcp==1.0.4', 'usaspending-mcp']
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '3'
          USASPENDING_TOOL_PROFILE: acquisition-agent
    - id: mcp-tavily-web
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: tavily-web
        transport: streamable-http
        url: https://mcp.tavily.com/mcp/
        headers:
          X-Tavily-Access-Mode: keyless
