- insert:
    - id: mcp-ecfr
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ecfr
        transport: stdio
        command: uvx
        args: ['--from', 'ecfr-mcp==1.0.5', 'ecfr-mcp']
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '3'
    - id: mcp-federal-register
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: federal-register
        transport: stdio
        command: uvx
        args: ['--from', 'federal-register-mcp==1.0.4', 'federal-register-mcp']
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '3'
    - id: mcp-regulations-gov
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: regulations-gov
        transport: stdio
        command: uvx
        args: ['--from', 'regulationsgov-mcp==1.0.8', 'regulationsgov-mcp']
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '4'
          REGULATIONS_GOV_API_KEY: !!js "process.env.REGULATIONS_GOV_API_KEY ?? 'DEMO_KEY'"
    - id: mcp-acquisition-gov
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: acquisition-gov
        transport: stdio
        command: uvx
        args: ['--from', 'acquisition-gov-mcp==1.0.1', 'acquisition-gov-mcp']
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '3'
