- insert:
    - id: mcp-bls-oews
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: bls-oews
        transport: stdio
        command: uvx
        args: ['--from', 'bls-oews-mcp==1.0.6', 'bls-oews-mcp']
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '3'
          BLS_API_KEY: !!js "process.env.BLS_API_KEY ?? ''"
    - id: mcp-gsa-calc
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: gsa-calc
        transport: stdio
        command: uvx
        args: ['--from', 'gsa-calc-mcp==1.0.4', 'gsa-calc-mcp']
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '3'
    - id: mcp-gsa-perdiem
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: gsa-perdiem
        transport: stdio
        command: uvx
        args: ['--from', 'gsa-perdiem-mcp==1.0.6', 'gsa-perdiem-mcp']
        env:
          FEDERAL_API_MIN_INTERVAL_SECONDS: '4'
          PERDIEM_API_KEY: !!js "process.env.PERDIEM_API_KEY ?? 'DEMO_KEY'"
