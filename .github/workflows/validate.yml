name: Validate agent packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out agent packages
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve the locked skills commit
        id: locked_skills
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("components.lock.json"))
          commit = lock["sources"]["skills"]["commit"]
          if not isinstance(commit, str) or len(commit) != 40:
              raise SystemExit(f"components.lock.json skills commit is not a full SHA: {commit!r}")
          print(f"ref={commit}")
          PY

      - name: Check out locked skills source
        uses: actions/checkout@v6
        with:
          repository: 1102tools-dev/federal-contracting-skills
          ref: ${{ steps.locked_skills.outputs.ref }}
          fetch-depth: 0
          path: _skills

      - name: Check out locked MCP source
        uses: actions/checkout@v6
        with:
          repository: 1102tools-dev/federal-contracting-mcps
          ref: b56de8475033aa46b12c842344e81dd1fcef18c7
          path: _mcps

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install validation dependencies
        run: python -m pip install jsonschema PyYAML openpyxl python-docx lxml mcp

      - name: Validate schemas, references, pins, and package hygiene
        run: python scripts/validate_packages.py

      - name: Reject vendored component drift
        run: python scripts/sync_components.py --check --skills-root _skills --mcp-root _mcps

      - name: Run current-catalog deterministic tests
        run: python -m unittest tests.test_orchestrators tests.test_routing_runner tests.test_tavily_policy -v

      - name: Compile bundled validators and run help
        run: python scripts/check_bundled_scripts.py

      - name: Start pinned MCP servers and discover tools without API calls
        run: |
          for plugin in pre-award-agent other-transaction-agent govcon-growth-agent; do
            uv run --with mcp --with httpx python scripts/smoke_mcp_discovery.py --plugin "$plugin"
          done
